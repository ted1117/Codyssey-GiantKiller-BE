[project]
name = "giantkiller-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "av>=15,<17",
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "fastapi[standard]>=0.162.0",
    "faster-whisper>=1.2.1",
    "firebase-admin>=7.7.0",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # import 정렬
    "B",    # flake8-bugbear
    "UP",   # 최신 Python 문법 권장
]

ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
